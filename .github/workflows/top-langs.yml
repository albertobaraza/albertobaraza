name: Update Top Languages

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: top-langs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Top Languages SVG
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
          INCLUDE_ORGS: albertorga
        run: node scripts/generate-top-langs.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- assets/top-langs.svg; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs.svg
          git commit -m "chore: update top languages [skip ci]"
          git push
