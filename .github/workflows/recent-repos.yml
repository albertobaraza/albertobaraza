name: Update Recent Repos

on:
  schedule:
    - cron: "15 3 * * *" # daily at 03:15 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: recent-repos
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Recent Repos SVG
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-recent-repos.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- assets/recent-repos.svg; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/recent-repos.svg
          git commit -m "chore: update recent repos [skip ci]"
          git push
